{% extends "base.html" %}

{% block content %}
  <h1>Delete Manufacturer</h1>
  <p><i>Do you really want to delete the manufacturer: {{ manufacturer }}?</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a class="button" href="{% url 'taxi:manufacturer-list' %}">Cancel</a>
  </form>
{% endblock %}
