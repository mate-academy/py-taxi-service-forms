{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <h1>Cars</h1>
  <a class="btn btn-primary mb-3" href="{% url 'taxi:car-create' %}">Create car</a>
  <ul class="list-group">
  {% for car in car_list %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a>
      <span>{{ car.manufacturer.name }}</span>
    </li>
  {% empty %}
    <li class="list-group-item">No cars yet</li>
  {% endfor %}
  </ul>
{% endblock %}
