{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h2>{{ object|yesno:"Update,Create" }} Manufacturer</h2>

  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'taxi:manufacturer-list' %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
