{% extends "base.html" %}

{% block content %}
  <h1>Car detail</h1>
  <p><b>Model:</b> {{ car.model }}</p>
  <p><b>Manufacturer:</b> {{ car.manufacturer }}</p>
  <p><b>Drivers:</b>
    {% for driver in car.drivers.all %}
      {{ driver.username }}{% if not forloop.last %}, {% endif %}
    {% endfor %}
  </p>

  <a href="{% url 'taxi:car-update' pk=car.id %}" class="btn btn-warning">Update</a>
  <a href="{% url 'taxi:car-delete' pk=car.id %}" class="btn btn-danger">Delete</a>
{% endblock content %}
