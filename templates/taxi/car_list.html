{% extends "base.html" %}


{% block content %}
  <h1>Car list   <a href="{% url 'taxi:car-create' %}">+</a></h1>
  <table class="table">
    <tr>
      <th>ID</th>
      <th>MODEL</th>
      <th>MANUFACTURER</th>
    </tr>
    {% for car in car_list %}
      <tr>
        <td><a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.id }}</a></td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
