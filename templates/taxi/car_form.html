{% extends "base.html" %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}

{% block content %}
  <h2>
    {% if object.pk %}
      Update Car
    {% else %}
      Create Car
    {% endif %}
  </h2>

  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">
      Save
    </button>
  </form>
{% endblock %}
