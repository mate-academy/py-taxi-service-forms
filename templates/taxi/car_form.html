{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  {% load crispy_forms_tags %}
  <h1>{{ object|yesno:"Update,Create" }} Car</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    {% comment %} <input type="submit" value="Save" class="btn btn-primary"> {% endcomment %}
    <button type="submit" class="btn btn-success">Create/Update Car</button>
  </form>
{% endblock content %}
