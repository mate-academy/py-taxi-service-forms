{% extends "base.html" %}

{% block content %}
  <h1>Delete Confirmation</h1>
  <p>Are you sure you want to delete "{{ object }}"?</p>

  <form method="post">
    {% csrf_token %}
    <a href="{{ request.META.HTTP_REFERER|default:'/' }}"
    class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
