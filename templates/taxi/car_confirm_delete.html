{% extends "base.html" %}

{% block content %}
  <h1>Delete car</h1>

  <p>Are you sure you want to delete {{ car }}?</p>

  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Delete" class="btn btn-danger">
    <a href="{{ request.META.HTTP_REFERER|default:car.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
