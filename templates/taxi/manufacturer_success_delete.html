{% extends "base.html" %}

{% block content %}
  <div class="container mt-4">
    <h1>Delete Manufacturer</h1>

    <p>
      Are you sure you want to delete the manufacturer:
      <strong>{{ manufacturer }}</strong>?
    </p>

    <form method="post">
      {% csrf_token %}

      <button type="submit" class="btn btn-danger">
        Yes, delete
      </button>

      <a href="{{ request.META.HTTP_REFERER|default:'/manufacturer/' }}"
         class="btn btn-secondary">
        Cancel
      </a>
    </form>
  </div>
{% endblock %}
