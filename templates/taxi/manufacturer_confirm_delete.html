{% extends "base.html" %}

{% block content %}
  <h1>Delete Manufacturer</h1>

  <p>Are you sure you want to delete the manufacturer: {{ manufacturer }}</p>
  <p><i>All cars from this manufacturer will be deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
  </form>
  <a href="{{ request.META.HTTP_REFERER|default:'/manufacturers/' }}" class="btn btn-secondary">Cancel</a>

{% endblock %}
