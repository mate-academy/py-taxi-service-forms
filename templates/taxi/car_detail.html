{% extends "base.html" %}

{% block content %}
  <p>Manufacturer: ({{ car.manufacturer.name }}, {{ car.manufacturer.country }})</p>
  <h1>Drivers</h1>
  <hr>
  <ul>
  {% for driver in car.drivers.all %}
    <li>{{ driver.username }} ({{ driver.first_name }} {{ driver.last_name }})</li>
  {% endfor %}
  </ul>
  <div class="d-flex">
  <p class="mr-2"><a class="btn btn-warning" href="{% url 'taxi:car-update' pk=car.id%}">UPDATE</a></p>
  <p><a class="btn btn-danger" href="{% url 'taxi:car-delete' pk=car.id%}">DELETE</a></p>
  </div>
{% endblock %}
