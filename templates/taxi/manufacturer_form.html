{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} manufacturer:</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      {{ form|crispy }}
    </div>
    <div class="border-top pt-3 d-flex gap-2">
      <input type="submit" value="{{ object|yesno:"Update,Create" }}" class="btn btn-success">
      <a href="{% url "taxi:manufacturer-list" %}" class="btn btn-outline-secondary ml-3">Cancel</a>
    </div>
  </form>
{% endblock %}
