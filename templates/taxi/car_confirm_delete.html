{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>
  <hr>
  <div class="alert alert-danger">
    <p>Are you sure you want to delete car <strong>"{{ object.model }}"</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Confirm Delete</button>
      <a href="{% url 'taxi:car-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
{% endblock %}
