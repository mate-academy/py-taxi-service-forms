<!DOCTYPE html>
<html>
<head>
    <title>Manufacturers</title>
</head>
<body>
    <h1>Manufacturers</h1>

    <a href="{% url 'taxi:manufacturer-create' %}">Create Manufacturer</a>

    <table>
        <tr>
            <th>Name</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>

        {% for manufacturer in manufacturer_list %}
        <tr>
            <td>{{ manufacturer.name }}</td>
            <td>
                <a href="{% url 'taxi:manufacturer-update' manufacturer.id %}">Update</a>
            </td>
            <td>
                <a href="{% url 'taxi:manufacturer-delete' manufacturer.id %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
