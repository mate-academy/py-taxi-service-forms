{% extends "base.html" %}
{% block content %}
  <h3>Are you sure you want to delete {{ car.model }}?</h3>
  <div class="d-flex">
    <a class="btn btn-outline-primary mr-3" href="{% url 'taxi:car-detail' pk=car.id %}">Cancel</a>
    <form action="" method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Confirm</button>
    </form>
  </div>
{% endblock %}
