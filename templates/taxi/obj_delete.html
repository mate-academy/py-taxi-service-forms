{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
<p>Are you sure you want to delete the {{obj}}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>
    <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
{% endblock %}
