{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>
  <p>Are you sure you want to delete car: {{ car }}?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete", class="btn btn-danger">
  </form>
  <div><a href="{% url 'taxi:car-detail' pk=car.id %}" class="btn btn-primary mt-2">Cancel</a></div>
{% endblock %}
