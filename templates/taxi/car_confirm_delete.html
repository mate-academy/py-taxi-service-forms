{% extends "base.html" %}

{% block content %}
  <h1>Delete car</h1>
  <p>Are you sure you want to delete the car "{{ car.model }}"?</p>
  {% url "taxi:car-list" as fallback_url %}
  <form method="post">
    {% csrf_token %}
    <input type="submit" value="Delete" class="btn btn-danger">
    <a href="{{ request.META.HTTP_REFERER|default:fallback_url }}"
       class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
