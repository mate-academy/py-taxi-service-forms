{% extends "base.html" %}

{% block content %}
  <h1>Delete manufacturer</h1>
  <p>Are you sure you want to delete "{{ manufacturer }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm</button>
    {% url 'taxi:manufacturer-list' as fallback_url %}
    <a href="{{ request.META.HTTP_REFERER|default:fallback_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
