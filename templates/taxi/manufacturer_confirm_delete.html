{%  extends "base.html" %}
{%  block content %}
  <h1>Delete Manufacturer</h1>
  <br>
  <p>Are you sure you want to delete the manufacturer: <b>{{ manufacturer }}</b></p>
  <form action="" method="post">
    {% csrf_token %}
    {{  form.as_p }}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="javascript:history.back()" class="btn btn-primary">Cancel</a>
  </form>
{% endblock %}
