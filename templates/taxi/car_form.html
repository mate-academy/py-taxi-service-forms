{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} car</h1>

  <form method="post" novalidate>
    {% csrf_token %}

    {{ form|crispy }}

    <input type="submit"
           value="Submit"
           class="btn btn-primary">

    <button type="button"
            onclick="window.history.back();"
            class="btn btn-secondary">
      Cancel
    </button>
  </form>
{% endblock %}
