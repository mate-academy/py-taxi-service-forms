{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
  <h1>Delete manufacturer</h1>
  <h3>Are you really sure want to delete {{ manufacturer.name }}?</h3>
  <p><i>All information about this manufacturer will be deleted!</i></p>
  <form method="post">
    {% csrf_token %}
    <input type="submit" class="btn btn-danger" value="Yes, I'm sure"/>
  </form>
{% endblock %}
