{% extends 'base.html' %}
{% load crispy_forms_filters %}
{% block content %}
  <h1>{% if object %}Update manufacturer: {{ object.model }}{% else %}Create manufacturer{% endif %}</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Submit" class="btn btn-primary">
  </form>
{% endblock %}
