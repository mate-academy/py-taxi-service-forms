{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Car List</h1>

    <a href="{% url 'taxi:car-create' %}" class="btn btn-primary">Create New Car</a>
  </div>

  {% if car_list %}
    <div class="list-group">
      {% for car in car_list %}
        <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
          <div>

            <a href="{% url 'taxi:car-detail' pk=car.id %}" class="font-weight-bold">
              #{{ car.id }} {{ car.model }}
            </a>
            <span class="text-muted ml-2">({{ car.manufacturer.name }})</span>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p class="alert alert-warning">There are no cars in taxi service.</p>
  {% endif %}
{% endblock %}
