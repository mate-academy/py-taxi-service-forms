{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>
  <p><i>Are you sure you want to delete: {{ car }}</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a class="btn btn-secondary" href="{% url 'taxi:car-detail' pk=car.id %}">Cancel</a>
  </form>
{% endblock %}
