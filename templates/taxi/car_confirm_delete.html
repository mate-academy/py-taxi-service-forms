{% extends "base.html" %}

{% block content %}
  <h2>Delete Car</h2>

  <p>Are you sure you want to delete car <strong>{{ object }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'taxi:car-detail' object.id %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
