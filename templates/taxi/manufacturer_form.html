{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>
    {% if object %}Update manufacturer{% else %}Create manufacturer{% endif %}
  </h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary" type="submit">Submit</button>
    <a class="btn btn-secondary" href="{{ request.META.HTTP_REFERER|default:'/' }}">
      Cancel
    </a>
  </form>
{% endblock %}
