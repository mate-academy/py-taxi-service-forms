{% extends "base.html" %}

{% block content %}
  <h1>Delete the Manufacturer</h1>

  <p>Are you sure you want to delete the manufacturer: <strong>{{ manufacturer }}</strong>?</p>
  <p style="color:red">(It will also delete all the cars of this manufacturer.)</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger" />
  </form>

  <div>
    <br>
    <a href="{{ previous_page }}">cancel</a>
  </div>
{% endblock %}
