{% extends 'base.html' %} {% block content %}
<form action="{% url 'taxi:manufacturer-delete' pk=object.pk %}" method="post">
  Are you sure you want to delete this?
  {% csrf_token %} {{form.as_p}}
  <input type="submit" value="Yes, delete" />
  {% url 'taxi:manufacturer-list' as fallback_url %}
  <a href="{{ request.META.HTTP_REFERER|default:fallback_url }}">Cancel</a>
</form>

{% endblock %}
