{% extends "base.html" %}

{% block content %}
  <h1>Delete Manufacturer</h1>
  <hr>
  <div class="alert alert-danger">
    <p>Are you sure you want to delete manufacturer <strong>"{{ object.name }}"</strong>?</p>
    <p class="text-muted"><small>Warning: This might affect cars linked to this manufacturer.</small></p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Confirm Delete</button>
      <a href="{% url 'taxi:manufacturer-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
{% endblock %}
