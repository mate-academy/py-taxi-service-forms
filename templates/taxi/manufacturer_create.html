{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <div class="container mt-4">
    <h1 class="mb-4">
      {{ object|yesno:"Update Past,Create New" }} Manufacturer
    </h1>

    <form method="post" novalidate>
      {% csrf_token %}

      {{ form|crispy }}

      <button type="submit" class="btn btn-primary">
        Submit
      </button>
    </form>
  </div>
{% endblock %}
