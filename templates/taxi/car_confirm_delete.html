{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
<h1>Delete Car</h1>
<p>Are you sure to delete car: {{ car.model }}</p>
<form action="" method="POST">
  {% csrf_token %}
  {{ form|crispy }}
  <input type="submit" value="Yes, delete" class="btn btn-danger">
</form>
<input type="submit" value="Cancel" onclick="history.back(); return false;">
{% endblock %}
