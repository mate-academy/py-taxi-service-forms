{% extends "base.html" %}
{% block content %}
  <h1>{{ object.model }}</h1>
  <p>Manufacturer: {{ object.manufacturer.name }}</p>
  <p>Drivers:
    {% for d in object.drivers.all %}
      {{ d.get_full_name }}{% if not forloop.last %}, {% endif %}
    {% empty %}
      No drivers
    {% endfor %}
  </p>
  <a class="btn btn-secondary" href="{% url 'taxi:car-update' object.id %}">Update</a>
  <a class="btn btn-danger" href="{% url 'taxi:car-delete' object.id %}">Delete</a>
  <a class="btn btn-outline-secondary" href="{% url 'taxi:car-list' %}">Back</a>
{% endblock %}
