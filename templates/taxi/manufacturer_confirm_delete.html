{% extends "base.html" %}
{% block content %}
  <h1>Delete manufacturer</h1>

  <p>Are you sure you want to delete the manufacturer: {{ manufacturer }}?</p>
  <i>This will delete all cars of selected manufacturer</i>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete!" class="btn btn-danger">
    <button class="btn btn-primary" type="button" onclick="history.back()">Cancel</button>
  </form>
{% endblock %}
