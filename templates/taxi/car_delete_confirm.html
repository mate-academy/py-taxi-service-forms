{% extends "base.html" %}
{% block content %}
  <h1>Delete car</h1>
  <p>Are you sure to delete car: {{ car }}?</p>
  <p><i>All manufacturers with this car will be also deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger"/>
    <a href="{% url 'taxi:car-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
