{% extends "base.html" %}
{% block content %}
  <h1>DELETE CAR</h1>
  <p>are you sure you want to delete car: {{ car }}?</p>
  <form action="" method="post">

    <a href="{% url 'taxi:car-detail' car.pk %}" class="btn btn-light">Cancel</a>
  </form>
{% endblock %}
