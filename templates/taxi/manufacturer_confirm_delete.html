{% extends "base.html" %}

{% block content %}
  <h1>Delete Manufacturer</h1>

  <p>Are you sure you want to delete manufacturer: {{ manufacturer }}?</p>
  <p><i>This manufacturer will be removed from all drivers and cars.</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{% url 'taxi:manufacturer-list' %}"><input type="submit" value="Cancel" class="btn btn-danger"></a>
  </form>

{% endblock %}
