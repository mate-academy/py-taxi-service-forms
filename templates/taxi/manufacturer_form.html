{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <h1>{% if object %}Update{% else %}Create{% endif %} manufacturer</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <a class="btn btn-secondary" href="{% if object %}{% url 'taxi:manufacturer-list' %}{% else %}{% url 'taxi:manufacturer-list' %}{% endif %}">Cancel</a>
  </form>
{% endblock %}
