{% extends "base.html" %}

{% block content %}
  <h1>Delete Confirmation</h1>
  <p>Are you sure you want to delete "{{ object }}"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm Delete</button>
    <a href="{{ text_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
