{% extends "base.html" %}

{% block content %}
  <div class="container mt-4">
    <div class="card">
      <div class="card-body">
        <h1 class="card-title">Delete Car</h1>

        <p class="card-text">
          Are you sure you want to delete the car:
          <strong>{{ car }}</strong>?
        </p>

        <form method="post">
          {% csrf_token %}

          <button type="submit" class="btn btn-danger">
            Yes, delete
          </button>

          <a href="{% url 'taxi:manufacturer-list' %}" class="btn btn-secondary">
            Cancel
          </a>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
