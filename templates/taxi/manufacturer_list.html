<a href="{% url 'taxi:manufacturer-create' %}" class="btn btn-primary link-to-page">
  Create Manufacturer
</a>

<table class="table">
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Country</th>
    <th>Update</th>
    <th>Delete</th>
  </tr>
  {% for manufacturer in manufacturer_list %}
    <tr>
      <td>{{ manufacturer.id }}</td>
      <td>{{ manufacturer.name }}</td>
      <td>{{ manufacturer.country }}</td>
      <td><a href="{% url 'taxi:manufacturer-update' pk=manufacturer.id %}">Update</a></td>
      <td><a href="{% url 'taxi:manufacturer-delete' pk=manufacturer.id %}">Delete</a></td>
    </tr>
  {% endfor %}
</table>
