{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <h1>Create car</h1>
  <form action="" method="post" novalidate>
  {% csrf_token %}
  {{ form|crispy }}
  <input class="btn btn-primary" type="submit" value="Submit">
  <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
