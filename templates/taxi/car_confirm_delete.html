{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>

  <p>Are you sure you want to delete this car: {{ car.model }}</p>
  <p><i>This car will be deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, Delete" class="btn btn-danger mr-2">
    <a href="{% url 'taxi:car-detail' car.pk %}" class="btn btn-primary">Cancel</a>
  </form>

{% endblock %}
