{% extends "base.html" %}

{% block content %}
  <h1>Delete manufacturer</h1>
  
  <p>Are you sure you want to delete the manufacturer: <strong>{{ manufacturer.name }}</strong>?</p>

  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <button onclick="window.history.back(); return false;" class="btn btn-secondary">Cancel</button>
  </form>
{% endblock %}
