{% extends "base.html" %}

{% block content %}
  <h1>Car DELETE</h1>
  <p>Are you sure want to delete the car {{ car }}?</p>

  <form action="" method="post">
    {% csrf_token %}
    <input class="btn btn-danger" type="submit" value="Yes, DELETE">
    <a href="{% url 'taxi:car_detail' %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
