{% extends "base.html" %}
{% block content %}
  <h1>Delete car?</h1>
  <p>Are you sure you want to delete "{{ object }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a class="btn btn-secondary" href="{% url 'taxi:car-detail' object.id %}">Cancel</a>
  </form>
{% endblock %}
