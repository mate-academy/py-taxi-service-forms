{% extends "base.html" %}

{% block content %}
  <h1>Delete Manufacturer: {{ manufacturer }}</h1>
  <p>Are you sure you want to delete the manufacturer?</p>

  <form action="" method="POST">
    {% csrf_token %}
    <input class="btn btn-success" type="submit" value="Yes, delete.">
    <a href="{% url "taxi:manufacturer-list" %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
