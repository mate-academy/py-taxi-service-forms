{% extends "base.html" %}

{% block content %}
  <h1>Delete {{ object }}?</h1>
  <p>Are you sure you want to delete this item?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
