
{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>
    {% if object %}
      Update car
    {% else %}
      Create car
    {% endif %}
  </h1>

  <form action="" method="post">
    {% csrf_token %}
    {{ form|crispy }}

    <input
      type="submit"
      value="Submit"
      class="btn btn-primary"
    >

    <a
      href="#"
      onclick="window.history.back(); return false;"
      class="btn btn-secondary"
    >
      Cancel
    </a>
  </form>
{% endblock %}
