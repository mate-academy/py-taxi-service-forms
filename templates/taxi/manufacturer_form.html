{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <h2>Create Manufacturer</h2>
  <form action="" method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" value="Submit" class="btn btn-primary">
      Submit
    </button>
    <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
