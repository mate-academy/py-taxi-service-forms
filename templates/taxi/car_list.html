{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  <a href="{% url 'taxi:car-create' %}" class="btn btn-primary mb-3">Add Car</a>
  
  <ul>
    {% for car in car_list %}
      <li><a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.model }}</a></li>
    {% endfor %}
  </ul>
{% endblock %}
