
{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>

  <a href="{% url 'taxi:car-create' %}" class="btn btn-primary">
    Create car
  </a>

  {% if car_list %}
    <table class="table">
      <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>

      {% for car in car_list %}
        <tr>
          <td>{{ car.id }}</td>
          <td>
            <a href="{% url 'taxi:car-detail' pk=car.id %}">
              {{ car.model }}
            </a>
          </td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% endfor %}
    </table>

  {% else %}
    <p>There are no cars in the service.</p>
  {% endif %}
{% endblock %}
