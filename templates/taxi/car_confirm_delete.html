{% extends "base.html" %}
{% block content %}
  <h1>Delete Car</h1>
  <p>Are you sure you want to delete this car: {{ car }}</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="Submit" value="Yes, delete" class="btn btn-danger">
    <a href="{{ request.META.HTTP_REFERER|default:'/' }}"
       class="btn btn-primary">Cancel</a>
  </form>
{% endblock content %}
