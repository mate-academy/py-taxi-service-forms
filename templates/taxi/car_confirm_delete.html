{% extends "base.html" %}

{% block content %}
  <h1>Delete Car: {{ car }}</h1>
  <p>Are you sure you want to delete the car?</p>

  <form action="" method="POST">
    {% csrf_token %}
    <input class="btn btn-success" type="submit" value="Yes, delete.">
    <a href="{% url "taxi:car-list" %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
