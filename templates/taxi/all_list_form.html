{% extends "base.html" %}
{% load crispy_forms_tags %}


{% block content %}
	<h1>{{ object|yesno:"Update, Create" }} New object</h1>

	<form action="" method="post" novalidate>
		{% csrf_token %}
		{{ form|crispy }}
		<input type="submit" value="Submit">
		<a href="{% url 'taxi:index' %}" class="btn btn-secondary">Cancel</a>
	</form>
{% endblock %}
