{% extends "base.html" %}

{% block content %}
  <h1>{{ car.model }}</h1>

  <p>Manufacturer: {{ car.manufacturer }}</p>

  <h3>Drivers</h3>

  <ul>
    {% for driver in car.drivers.all %}
      <li>{{ driver.username }}</li>
    {% empty %}
      <li>No drivers</li>
    {% endfor %}
  </ul>

  <a href="{% url 'taxi:car-update' pk=car.pk %}" class="btn btn-primary">
    Update
  </a>

  <a href="{% url 'taxi:car-delete' pk=car.pk %}" class="btn btn-danger">
    Delete
  </a>
{% endblock %}
