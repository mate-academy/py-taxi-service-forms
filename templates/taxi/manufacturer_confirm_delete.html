{% extends "base.html" %} {% load crispy_forms_tags %} {% block content %}
<h2>Confirm Delete Manufacturer</h2>
<p>
  Are you sure you want to delete the manufacturer "{{ manufacturer.name }}"?
</p>
<form method="post">
  {% csrf_token %} {{ form|crispy }} <input type="submit" value="Yes, delete" />
  <a href="{% url 'taxi:manufacturer_list' %}">Cancel</a>
</form>
{% endblock %}
