{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>

  <form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete this car?</p>
    <button type="submit">Delete</button>
    <a href="{{ request.META.HTTP_REFERER|default:'/' }}">Cancel</a>
  </form>
{% endblock %}
