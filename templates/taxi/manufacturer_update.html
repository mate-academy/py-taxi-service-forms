{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <h1>Update Manufacturer</h1>
  <form method="post" action="{% url 'taxi:manufacturer-update' manufacturer.pk %}">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Update</button>
    <a href="{% url 'taxi:manufacturer-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
