{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <h1>Delete</h1>
  <p>Are you sure you want to delete? "{{ object }}"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{{next|default:"/"}}">Cancel</a>
  </form>

{% endblock %}
