{% extends "base.html" %}

{% block content %}
  <h1>Delete car</h1>
  <p>Are you sure you want to delete {{ car }}?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-secondary" href="{{ request.META.HTTP_REFERER|default:'/' }}">
      Cancel
    </a>
  </form>
{% endblock %}
