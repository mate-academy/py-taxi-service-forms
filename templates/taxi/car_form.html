{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block content %}
  <h1>{{ car|yesno:"Update,Create" }} Car</h1>
  <form method="POST" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Submit" class="btn btn-primary">
  </form>
  <a style="color: white;text-decoration: none" href="{% url 'taxi:car-list' %}">
    <button class="btn btn-danger">Cancel</button>
  </a>
{% endblock %}
