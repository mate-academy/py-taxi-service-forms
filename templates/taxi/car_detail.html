{% extends "base.html" %}

{% block content %}
  <p>Manufacturer: ({{ car.manufacturer.name }}, {{ car.manufacturer.country }})</p>
  <h1>Drivers</h1>
  <hr>
  <ul>
  {% for driver in car.drivers.all %}
    <li>{{ driver.username }} ({{ driver.first_name }} {{ driver.last_name }})</li>
  {% endfor %}
  </ul>

  <table>
    <tr>
      <td>
        <form method="get" action="{% url 'taxi:car-update' pk=car.id %}">
          <button type="submit" class="btn btn-primary rounded-pill px-2 py-0 ">
            Update
          </button>
        </form>
      </td>
      <td>
        <form method="get" action="{% url 'taxi:car-delete' pk=car.id %}">
          <button type="submit" class="btn btn-primary rounded-pill px-2 py-0 ">
            Delete
          </button>
        </form>
      </td>
    </tr>
  
  </table>
  


{% endblock %}
