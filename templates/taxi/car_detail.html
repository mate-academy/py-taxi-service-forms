{% extends "base.html" %}

{% block content %}
  <div>
    <p>Manufacturer: ({{ car.manufacturer.name }}, {{ car.manufacturer.country }})</p>
    <a href="{% url 'taxi:car-update' pk=car.id%}?next={{ request.path }}" class="btn btn-primary">Update</a>
    <a href="{% url 'taxi:car-delete' pk=car.id%}?next={{ request.path }}" class="btn btn-danger">Delete</a>
  </div>
  <h1>Drivers</h1>
  <hr>
  <ul>
  {% for driver in car.drivers.all %}
    <li>{{ driver.username }} ({{ driver.first_name }} {{ driver.last_name }})</li>
  {% endfor %}
  </ul>
{% endblock %}
