{% extends "base.html" %}

{% block content %}
  <h1>Car List
    <a href="{% url 'taxi:car-create' %}">+</a>
  </h1>
  <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.id }}</a>
          {{ car.model }} ({{ car.manufacturer.name }})
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no cars in taxi</p>
  {% endif %}
{% endblock %}
