{% extends "base.html" %}

{% block content %}
  <h1>Driver list</h1>

  <ul>
    {% for driver in driver_list %}
      <li>
        <a href="{% url 'taxi:driver-detail' driver.id %}">
          {{ driver.username }}
          {% if driver == user %}
            <strong>(Me)</strong>
          {% endif %}
        </a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
