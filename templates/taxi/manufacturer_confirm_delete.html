{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>Delete manufacturer?</h1>

  <form method="post">
    {{ form|crispy }}
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
      Confirm
    </button>

    <button type="button" class="btn btn-secondary" onclick="window.history.back();">
      Cancel
    </button>

  </form>
{% endblock %}
