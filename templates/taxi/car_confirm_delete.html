{ % extends "base.html" %}
{% load crispy_forms_tags %}

{ % block content %}
  <h1>Delete car</h1>

  <p>Are you sure you want to delete car {{ car }}?</p>
  <p><i>All cars with this list will be also deleted!</i></p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm</button>
    <button type="button" class="btn btn-secondary" onclick="window.history.back();">Cancel</button>
  </form>
{ % endblock %}
