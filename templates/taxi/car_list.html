{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>

  <p>
    <a href="{% url 'taxi:car-create' %}" class="btn btn-primary">
      Create car
    </a>
  </p>

  {% if car_list %}
    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
      </thead>
      <tbody>
      {% for car in car_list %}
        <tr>
          <td>
            <a href="{% url 'taxi:car-detail' pk=car.pk %}">
              {{ car.pk }}
            </a>
          </td>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>There are no cars in the taxi service.</p>
  {% endif %}
{% endblock %}
