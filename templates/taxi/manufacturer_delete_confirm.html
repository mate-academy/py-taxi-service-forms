{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer with id <strong>{{ manufacturer.id }}({{ manufacturer.name }})</strong> delete</h1>
  <p>Are you sure that you want to delete this Manufacturer?</p>
  <p>All vehicles from this manufacturer will be deleted as well</p>
  <form action="" method="post">
    {% csrf_token %}
    <input class="btn btn-danger" type="submit" value="Yes, delete">
    <a class="btn btn-outline-primary" href="{% url 'taxi:manufacturer-list' %}">Cancel</a>
  </form>
{% endblock %}
