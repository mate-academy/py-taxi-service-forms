{ % extends "base.html" %}

{ % block content %}
  <h1>Delete car</h1>

  <p>Are you sure you want to delete car {{ car }}?</p>
  <p><i>All cars with this CAR will be also deleted!</i></p>

  <form method="post">
    {% csrf_token %}
    <input type="submit" value="Confirm" class="btn btn-danger">
  </form>
{ % endblock %}
