{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>
  <p>Are you sure you want to remove the car: {{ car }}?</p>
  <form action="" method="post">
    {% csrf_token %}
  <input type="submit" value="Yes delete" class="btn btn-danger">
  <a style="margin: 0 40px" class="btn btn-success" href="{{ request.META.HTTP_REFERER }}">Cancel</a>
  </form>
{% endblock %}
