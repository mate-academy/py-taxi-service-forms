{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>
  <p>Are you sure you want to delete the car "{{ object }}"?</p>
  <p><i> All related data will be permanently deleted.</i></p>
  <form method="post">
    {% csrf_token %}
    <input class="btn btn-danger" type="submit" value="Delete Car">
    <a href="{% url 'taxi:car-list' %}">Cancel</a>
  </form>
{% endblock %}
