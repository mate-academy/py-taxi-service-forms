{% extends "base.html" %}

{% block content %}
  <h1>Car list </h1>
  <form action="{%  url "taxi:car-create" %}" method="get" novalidate>
    {% csrf_token %}
    <input class="btn btn-primary" type="submit" value="Create">
  </form>

  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url "taxi:car-detail" pk=car.id %} ">{{ car.id }}</a>
          {{ car.model }} ({{ car.manufacturer.name }})
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no cars in taxi</p>
  {% endif %}
{% endblock %}
