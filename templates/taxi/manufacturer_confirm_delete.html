{% extends "base.html" %}

{% block content %}
  <h1>Delete manufacturer</h1>
  <p>Are you sure you want to delete the manufacturer "{{ manufacturer.name }}"?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    {% url 'taxi:manufacturer-list' as manufacturer_list_url %}
    <a href="{{ request.META.HTTP_REFERER|default:manufacturer_list_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
