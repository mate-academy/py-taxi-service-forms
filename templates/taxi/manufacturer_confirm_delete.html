{% extends "base.html" %}

{% block content %}

  <p>Are you sure you want to delete the Manufacture: {{ manufacturer }} ?</p>
  <p><i style="color: red; font-weight: bold">All Drivers and Cars with this manufacturer will be also deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete"/>
  </form>
{% endblock %}
