{% extends "base.html" %}

{% block content %}
  <h1>Delete Manufacturer</h1>

  <p>Are you sure you want to delete manufacturer: {{ manufacturer }}?</p>
  <p><i>All cars from this manufacturer will also be deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="javascript:history.back()" class="btn btn-secondary">Might find some use for you yet</a>

  </form>
{% endblock %}
