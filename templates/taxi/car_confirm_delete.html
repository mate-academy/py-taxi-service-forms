{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>

  <p>Are you sure you want to delete "{{ car }}"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm</button>
    <a href="{{ request.META.HTTP_REFERER|default:'taxi:car-list' }}"
       class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
