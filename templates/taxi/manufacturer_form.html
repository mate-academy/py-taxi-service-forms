{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <form method="post">
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-primary">Submit</button>
  <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-secondary">Cancel</a>
  </form>

{% endblock %}
