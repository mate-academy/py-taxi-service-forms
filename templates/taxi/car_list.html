{% extends "base.html" %}
{% block content %}
  <h1>
    Car list
    <a class="btn btn-primary float-end"
       href="{% url 'taxi:car-create' %}">Create</a>
  </h1>
  {% if car_list %}
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Model</th>
          <th>Manufacturer</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr>
            <td>
              <a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.id }}</a>
            </td>
            <td>{{ car.model }}</td>
            <td>{{ car.manufacturer.name }}</td>
            <td>
              <a href="{% url 'taxi:car-update' pk=car.id %}" class="btn btn-primary">UPDATE</a>
            </td>
            <td>
              <a href="{% url 'taxi:car-delete' pk=car.id %}" class="btn btn-danger">DELETE</a>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>There are no cars in taxi</p>
  {% endif %}
{% endblock %}
