{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Cars</h1>

  <a href="{% url 'taxi:car-create' %}">Create car</a>

  {% if car_list %}
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Model</th>
          <th>Manufacturer</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr>
            <td>
              <a href="{% url 'taxi:car-detail' pk=car.pk %}">
                {{ car.id }}
              </a>
            </td>
            <td>{{ car.model }}</td>
            <td>{{ car.manufacturer.name }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No cars available.</p>
  {% endif %}
{% endblock %}
