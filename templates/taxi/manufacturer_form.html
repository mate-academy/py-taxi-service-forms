{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} Manufacturer</h1>
  <form action="" method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input class="btn btn-primary" type="submit" value="Submit">
    {% url 'taxi:manufacturer-list' as manufacturer_list_url %}
    <a href="{{ request.GET.next|default:manufacturer_list_url }}">Cancel</a>
  </form>
{% endblock %}
