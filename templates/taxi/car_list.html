{% extends "base.html" %}

{% block content %}
  <h1>
    Car List
    <a style="float: right" class="btn btn-primary" href="{% url 'taxi:car-create' %}">+</a>
  </h1>

  {% if car_list %}
    <table class="table">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
      {% for car in car_list %}
        <tr>
          <td>{{ car.id }}</td>
          <td><a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.model }}</a></td>
          <td>
            <a href="{% url 'taxi:car-update' pk=car.id %}">UPDATE</a>
          </td>
          <td>
            <a href="{% url 'taxi:car-delete' pk=car.id %}">DELETE</a>
          </td>
        </tr>
      {% endfor %}
    </table>
    <a class="btn btn-secondary" href="javascript:history.back()">Cancel</a>
  {% else %}
    <p>There are no cars in the service.</p>
  {% endif %}
{% endblock %}
