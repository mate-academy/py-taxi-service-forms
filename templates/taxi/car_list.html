{% extends "base.html" %}

{% block content %}
  <h1>Cars</h1>

  <ul>
    {% for car in car_list %}
      <li>
        {{ car.model }} — {{ car.manufacturer.name }}
        <a href="{% url 'taxi:car-detail' car.id %}">View</a>
      </li>
    {% empty %}
      <p>There are no cars in taxi.</p>
    {% endfor %}
  </ul>

  <a href="{% url 'taxi:car-create' %}">Add new car</a>
{% endblock %}
