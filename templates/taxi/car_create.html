{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <div class="container mt-4">
    <h1>Create Car</h1>

    <form method="post">
      {% csrf_token %}

      {{ form|crispy }}

      <button type="submit" class="btn btn-primary">
        Submit
      </button>

      <a href="{{ request.META.HTTP_REFERER|default:'/cars/' }}"
         class="btn btn-secondary">
        Cancel
      </a>
    </form>
  </div>
{% endblock %}
