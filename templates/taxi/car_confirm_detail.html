
{% extends "base.html" %}

{% block content %}
  <h1>Delete car</h1>
  <p>Are you sure you want to delete "{{ car }}"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm</button>
    <a href="{% url 'taxi:car-detail' pk=car.pk %}"
       class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
