{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>{% if object %}Update{% else %}Create{% endif %} manufacturer</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary" type="submit">Submit</button>
    <a class="btn btn-secondary" href="{% url 'taxi:manufacturer-list' %}">
      Cancel
    </a>
  </form>
{% endblock %}
