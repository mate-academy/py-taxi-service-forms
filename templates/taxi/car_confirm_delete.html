{% extends "base.html" %} {% load crispy_forms_tags %} {% block content %}
<h2>Confirm Delete Car</h2>
<p>Are you sure you want to delete the car "{{ car.model }}"?</p>
<form method="post">
  {% csrf_token %} {{ form|crispy }} <input type="submit" value="Yes, delete" />
  <a href="{% url 'taxi:car_list' %}">Cancel</a>
</form>
{% endblock %}
