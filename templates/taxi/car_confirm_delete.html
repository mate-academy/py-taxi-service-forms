{% extends "base.html" %}

{% block content %}

  <h1>Delete Car</h1>

  <p>Are you sure you want to delete the car: {{ car }}?</p>
  <form action="" method="POST">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger rounded-pill px-3">
    <a href="{{ cancel_url }}" class="btn btn-primary rounded-pill px-3">Cancel</a>
  </form>

{% endblock %}
