{% extends "base.html" %}

{% block content %}
  <h1>Delete car</h1>
  <p>Are you sure you want to delete car: {{ car.model }} {{ car.manufacturer.name }}?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input class="btn btn-danger" type="submit" value="Delete">
    <a class="btn btn-secondary" href="{% url 'taxi:car-detail' pk=car.pk %}">Cancel</a>
  </form>
{% endblock %}
