{% extends "base.html" %}

{% block content %}
  <p>Are you sure you want to delete this car <a href="{% url "taxi:car-detail" pk=car.id %}">{{ car.id }} {{ car.model }}</a></p>
  <form method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" style="background-color: red; color: white">
  </form>
  <a href="javascript:history.back()">Cancel</a>
{% endblock %}
