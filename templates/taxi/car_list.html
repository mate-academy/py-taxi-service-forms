{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Car List</h1>
    <a href="{% url 'taxi:car-create' %}" class="btn btn-primary">
      Create Car
    </a>
  </div>

  <ul>
    {% for car in car_list %}
      <li>
        <a href="{% url 'taxi:car-detail' car.id %}">
          {{ car.model }}
        </a> 
        ({{ car.manufacturer.name }})
      </li>
    {% empty %}
      <p>No cars available.</p>
    {% endfor %}
  </ul>
{% endblock %}
