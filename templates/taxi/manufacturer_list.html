{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <h1>Manufacturers</h1>
  <a class="btn btn-primary mb-3" href="{% url 'taxi:manufacturer-create' %}">Create manufacturer</a>
  <table class="table">
    <thead><tr><th>Name</th><th>Country</th><th>Update</th><th>Delete</th></tr></thead>
    <tbody>
    {% for m in manufacturer_list %}
      <tr>
        <td>{{ m.name }}</td>
        <td>{{ m.country }}</td>
        <td><a class="btn btn-sm btn-secondary" href="{% url 'taxi:manufacturer-update' m.id %}">Update</a></td>
        <td><a class="btn btn-sm btn-danger" href="{% url 'taxi:manufacturer-delete' m.id %}">Delete</a></td>
      </tr>
    {% empty %}
      <tr><td colspan="4">No manufacturers</td></tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
