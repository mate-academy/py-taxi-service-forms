{% extends "base.html" %}

{% block content %}
<h1>Delete Manufacturer: {{ manufacturer }}</h1>
<p>Are you sure you want to delete the manufacturer?</p>
<form action="" method="POST">
  {% csrf_token %}
  <input class="btn btn-danger" type="submit" action="" value="Yes, delete.">
</form>
<br>
<div>
  <a href="{% url 'taxi:manufacturer-list' %}" class="btn btn-primary">
    Cancel
  </a>
</div>
{% endblock %}
