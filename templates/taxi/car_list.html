{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center">
    <h1>Car List</h1>
    <a href="{% url 'taxi:car-create' %}" class="btn btn-primary">
      Create New
    </a>
  </div>

  {% if car_list %}
    <table class="table">
      <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Details</th>
        </tr>
      </thead>

      <tbody>
        {% for car in car_list %}
          <tr>
            <td>{{ car.id }}</td>
            <td>
              <a href="{% url 'taxi:car-detail' pk=car.id %}">
                {{ car.model }}
              </a>
            </td>
            <td>
              <a href="{% url 'taxi:car-detail' pk=car.id %}"
                 class="btn btn-info btn-sm">
                Details
              </a>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>There are no Cars in List.</p>
  {% endif %}
{% endblock %}
