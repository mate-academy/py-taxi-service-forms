{% extends "base.html" %}
{% block content %}
    <h1>Delete Car</h1>

    <p>Are you sure you want to delete the car: {{ car }}?</p>
    <p><i>This car will be unassigned from all drivers.</i></p>
    <form action="" method="post">
        {% csrf_token %}
        <input type="submit" value="Yes, delete" class="btn btn-danger" />
    </form>

{% endblock %}
