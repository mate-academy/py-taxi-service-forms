{% extends "base.html" %}
{% block content %}
  <h1>Delete Car</h1>
  <p>Are you sure you want to delete car: {{ car.model }}?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input class="btn btn-primary" type="submit" value="Yes, delete">
    {% url 'taxi:car-list' as car_list_url %}
    <a href="{{ request.GET.next|default:car_list_url }}">Cancel</a>
  </form>
{% endblock %}
