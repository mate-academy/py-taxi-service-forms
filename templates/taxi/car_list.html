{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>

  <a href="{% url 'taxi:car-create' %}">Create Car</a>

  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url 'taxi:car-detail' car.id %}">
            {{ car.model }}
          </a>
          ({{ car.manufacturer.name }})
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no cars in the service.</p>
  {% endif %}
{% endblock %}
