{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h2>{% if object %}Update{% else %}Create{% endif %} Manufacturer</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="{% if object %}Update{% else %}Create{% endif %}" class="btn btn-primary" />
    <a href="{% url 'taxi:manufacturer-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
