{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<form method="post">
  <h3>{{form|yesno:"Create,Update"}} manufacturer</h3>
  {% csrf_token %}
  {{ form|crispy }}
  <a href="{% url 'taxi:manufacturer-list' %}" class="btn btn-primary">Cancel</a>
  <input type="submit" value="Submit" class="btn btn-primary">
</form>

{% endblock %}
