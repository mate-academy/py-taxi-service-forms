{% extends 'base.html' %}
{% load crispy_forms_filters %}


{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} a car</h1>

  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <input class="button" type="submit" value="Submit">
    <a href="" onclick="window.history.back()" class="button">Cancel</a>
  </form>
{% endblock %}
