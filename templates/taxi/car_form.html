{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>{% if object %}Update{% else %}Create{% endif %} car</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary" type="submit">Submit</button>
    {% if object %}
      <a class="btn btn-secondary" href="{% url 'taxi:car-detail' pk=object.id %}">
        Cancel
      </a>
    {% else %}
      <a class="btn btn-secondary" href="{% url 'taxi:car-list' %}">Cancel</a>
    {% endif %}
  </form>
{% endblock %}
