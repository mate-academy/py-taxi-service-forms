{% extends "base.html" %}

{% block content %}
  <h1>Delete car?</h1>

  <p>Are you sure you want to delete "{{ car }}"?</p>

  <form method="post">
    {% csrf_token %}

    <input type="submit"
           value="Yes, delete"
           class="btn btn-danger">

    <button type="button"
            onclick="window.history.back();"
            class="btn btn-secondary">
      Cancel
    </button>
  </form>
{% endblock %}
