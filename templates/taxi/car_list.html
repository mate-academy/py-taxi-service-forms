{% extends "base.html" %}

{% block content %}
  <h1>Car List <a style="float: right" href="{% url 'taxi:car-create' %}">+</a></h1>
  {% if car_list %}
    <table class="table">
      <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
      {% for car in car_list %}
        <tr>
          <th>
            <a href="{% url 'taxi:car-detail' pk=car.id %} ">{{ car.id }}</a>
          </th>
          <th>
            {{ car.model }}
          </th>
          <th>
            ({{ car.manufacturer.name }})
          </th>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no cars in taxi</p>
  {% endif %}
{% endblock %}
