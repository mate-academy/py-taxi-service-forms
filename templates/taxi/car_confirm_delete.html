{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>
  <p>Are you sure want to delete car: {{ car.model }}</p>
  <a href="{% url "taxi:car-list" %}" class="btn btn-secondary">Cancel</a>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
  </form>
{% endblock %}
