{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Cars</title>
</head>
<body>
    <h1>Cars</h1>

    <a href="{% url 'taxi:car-create' %}">Create Car</a>

    <ul>

            </li>
        {% endfor %}
    </ul>
</body>
</html>
