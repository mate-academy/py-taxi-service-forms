{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>
  <p>Are you sure you want to delete car: {{ car }}?</p>
  <p><i>It couldn't be recovered!</i></p>
  <div class="d-flex">
    <form class="mr-2" action="" method="post">
    {% csrf_token %}
    <input class="btn btn-danger" type="submit" value="Yes, delete">
  </form>
  <p>
    {% url 'taxi:car-list' as list_url %}
    <a class="btn btn-success" href="{{ next|default:list_url}}">Cancel</a></p>
  </div>

{% endblock %}
