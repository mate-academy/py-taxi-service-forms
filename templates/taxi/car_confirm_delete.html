{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>

  <p>Are you sure you want to delete the car: {{ car }}</p>
  <form action="" method="post" class="d-flex align-items-center">
    {% csrf_token %}
    <input class="btn btn-danger" type="submit" value="Yes, delete">
    <a style="margin-left: 10px" href="{% url 'taxi:car-detail' pk=car.pk %}" class="btn btn-secondary">Cancel</a>
  </form>

{% endblock %}
