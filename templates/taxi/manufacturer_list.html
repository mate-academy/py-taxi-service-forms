<a href="{% url 'taxi:manufacturer-create' %}"
   class="btn btn-success mb-3">Add Manufacturer</a>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Country</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
  </thead>
  <tbody>
    {% for manufacturer in manufacturer_list %}
      <tr>
        <td>{{ manufacturer.name }}</td>
        <td>{{ manufacturer.country }}</td>
        <td>
          <a href="{% url 'taxi:manufacturer-update' manufacturer.id %}"
             class="btn btn-primary btn-sm">Update</a>
        </td>
        <td>
          <a href="{% url 'taxi:manufacturer-delete' manufacturer.id %}"
             class="btn btn-danger btn-sm">Delete</a>
        </td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="4">No manufacturers available.</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
