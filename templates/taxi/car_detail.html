{% extends "base.html" %}

{% block content %}
  <p>Manufacturer: ({{ car.manufacturer.name }}, {{ car.manufacturer.country }})</p>
  <h1>Drivers 
    <a class="right-side btn btn-primary" href="{% url 'taxi:car-delete' object.id %}">DELETE</a>
    <a class="right-side space-between btn btn-primary" href="{% url 'taxi:car-update' car.id %}">UPDATE</a>
  </h1>
  <hr>
  <ul>
  {% for driver in car.drivers.all %}
    <li>{{ driver.username }} ({{ driver.first_name }} {{ driver.last_name }})</li>
  {% endfor %}
  </ul>
{% endblock %}
