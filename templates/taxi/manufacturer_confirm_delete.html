{% extends "base.html" %}

{% block content %}
  <h1>Delete manufacturer:</h1>

  <p>Are you sure you want to delete the manufacturer <strong>{{ manufacturer }}</strong>?</p>
  <p>All cars produced by it will be removed along with it.</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, I am." class="btn btn-danger">
    <a href="{% url "taxi:manufacturer-list" %}" class="btn btn-outline-secondary ml-3">Cancel</a>
  </form>
{% endblock %}
