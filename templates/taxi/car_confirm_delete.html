{% extends "base.html" %}

{% block content %}
  <a href="{% url "taxi:car-detail" pk=car.pk%}">CANCEL</a>
  <br><br>
  <h1>Delete the car</h1>
  <p><strong> Are you sure you want to delete this car: "{{ car.model }}"?</strong></p>
  <p><i>This will remove the car from all drivers.</i></p>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    <input type="submit" class="btn btn-danger" value="Yes, delete the car.">
  </form>
{% endblock %}
