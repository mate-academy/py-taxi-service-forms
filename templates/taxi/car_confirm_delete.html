{% extends "base.html" %}


{% block content %}
  <h1>Are you sure you want to delete {{ car.model }}?</h1>

  <p><i>All manufacturers will be also deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="javascript:history.back()" class="btn btn-primary">Cancel</a>
  </form>
{% endblock %}
