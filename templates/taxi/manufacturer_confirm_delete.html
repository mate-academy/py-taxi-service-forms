{% extends "base.html" %}

{% block content %}
  <h1>Delete Manufacturer</h1>
  <p>Are you sure that you want to delete the manufacturer: {{ manufacturer }}</p>
  <p><i>All cars of this manufacturer will also be deleted!</i></p>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <input class="btn btn-danger" type="submit" value="Yes, delete">
  </form>

{% endblock %}
