{% extends "base.html" %}
{% block content %}
  <h1>Manufacturer Car</h1>
  <p>Are you sure you want to delete the manufacturer: {{ manufacturer }}? </p>
  <p><i>All dates with this manufacturer will be also  deleted</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a class="btn btn-secondary" href="javascript:history.back()">Cancel</a>
  </form>
{% endblock %}
