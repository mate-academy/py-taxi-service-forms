{% extends "base.html" %}

{% block content %}
  <h1>Delete Manufacturer</h1>

  <p>Are you sure you want to delete the car {{ manufacturer.name }}?</p>
  <p><i>All сars from this manufacturer will be deleted!!!</i></p>
  <form action="" method="post" novalidate>
    {% csrf_token %}

    <input class="btn btn-danger" type="submit" value="Yes, delete">
  </form>

  <a href="javascript:history.back()" class="btn btn-secondary" type="button">Cancel</a>
{% endblock %}
