{% extends "base.html" %}
{% block content %}
  <h1>Delete Manufacturer</h1>
  <p>You really want to delete this {{ manufacturer }}?</p>
  <p>Be sure, because when you delete it, everything that was associated with the manufacturer will also be deleted</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, I'm Sure" class="btn btn-danger">
    <button type="button" onclick="history.back();" class="btn btn-secondary">Cancel</button>
  </form>
{% endblock %}
