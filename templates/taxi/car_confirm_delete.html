{% extends 'base.html' %}
{% block content %}
  <p>Are you sure you want to delete this car: {{ car }}?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
      Yes, delete
    </button>
  </form>
  <br>
  <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-primary">
    Cancel
  </a>
{% endblock %}
