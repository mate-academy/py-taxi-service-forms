{% extends "base.html" %}

{% block content %}
  <h1>{{ view.__class__.__name__ }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-success">Save</button>
    <button type="button" class="btn btn-secondary" onclick="history.back()">
      Cancel
    </button>
  </form>
{% endblock %}
