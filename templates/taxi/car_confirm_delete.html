{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>
  <p>Are you sure you want to delete the car: <strong>{{ object.model }}</strong>?</p>

  <form action="" method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm Delete</button>
    <a href="{% if request.META.HTTP_REFERER %}{{ request.META.HTTP_REFERER }}
      {% else %}{% url 'taxi:car-list' %}
    {% endif %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
