{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between">
    <h1>Car list</h1>
    <a href="{% url 'taxi:car-create' %}" class="btn btn-success d-flex justify-content-center align-items-center">+ Create</a>
  </div>

  {% if car_list %}
    <table class="table">
      <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
        <th>Actions</th>
      </tr>
      {% for car in car_list %}
        <tr>
          <td>{{ car.id }}</td>
          <td><a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.model }}</a></td>
          <td>{{ car.manufacturer.name }}</td>
          <td>
            <a href="{% url 'taxi:car-update' pk=car.id %}" class="btn btn-primary btn-sm">Update</a>
            <a href="{% url 'taxi:car-delete' pk=car.id %}" class="btn btn-danger btn-sm">Delete</a>
          </td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no cars in taxi</p>
  {% endif %}
{% endblock %}
