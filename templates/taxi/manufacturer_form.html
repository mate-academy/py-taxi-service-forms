{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>{{ object.id|yesno:"Update,Create" }} manufacturer</h1>

  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    
    <input type="submit" value="Submit" class="btn btn-primary">
    <button onclick="window.history.back(); return false;" class="btn btn-secondary">Cancel</button>
  </form>
{% endblock %}
