{% extends "base.html" %}

{% block content %}
  <h1>Cars List
    <div style="float: right">
      <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-secondary">Cancel</a>
      <a class="btn btn-primary" href="{% url 'taxi:car-create' %}">+</a>
    </div>
  </h1>

  {% if car_list %}
    <table class="table">
      <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>

      {% for car in car_list %}
        <tr>
          <td>
            {{ car.id }}
          </td>
          <td>
            {{ car.model }}
          </td>
          <td>
            {{ car.manufacturer }}
          </td>
          <td>
            <a href="{% url 'taxi:car-update' pk=car.id %}">UPDATE</a>
          </td>
          <td>
            <a href="{% url 'taxi:car-delete' pk=car.id %}">DELETE</a>
          </td>
        </tr>
      {% endfor %}
    </table>

  {% else %}
    <p>There are no cars in the service.</p>
  {% endif %}
{% endblock %}
