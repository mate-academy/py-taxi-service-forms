{% extends "base.html" %}

{% block content %}
  <h1>Delete manufacturer</h1>

  <p>Are you sure you want to delete this manufacturer?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
      Delete
    </button>
    <a href="javascript:history.back()" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
