{% extends "base.html" %}

{% block content %}
  <h1>Delete car</h1>

  <p>Are you sure you want to delete this car?</p>

  <form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
      Delete
    </button>

    <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
