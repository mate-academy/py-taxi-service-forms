<!-- Em car_list.html -->
{% block content %}
    <h1>Lista de Carros</h1>
    
    <p><a href="{% url 'taxi:car-create' %}" class="btn btn-primary">Adicionar Novo Carro</a></p>
    
    <!-- Seu loop de listagem de carros aqui -->
    {% for car in object_list %}
        <p>
            <a href="{{ car.get_absolute_url }}">{{ car.model }}</a>
            <!-- Mais detalhes... -->
        </p>
    {% endfor %}
{% endblock %}
