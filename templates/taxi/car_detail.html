{% extends "base.html" %}

{% block content %}
  <form action="{% url "taxi:car-update" pk=car.id %}" method="get">
    <button type="submit" class="btn btn-primary">Edit a car</button>
  </form>
  <hr>
  <form action="{% url "taxi:car-delete" pk=car.id %}" method="get">
    <button type="submit" class="btn btn-primary">Delete a car</button>
  </form>
  <hr>
  <p>Manufacturer: ({{ car.manufacturer.name }}, {{ car.manufacturer.country }})</p>
  <h1>Drivers</h1>
  <hr>
  <ul>
    {% for driver in car.drivers.all %}
      <li>{{ driver.username }} ({{ driver.first_name }} {{ driver.last_name }})</li>
    {% endfor %}
  </ul>
{% endblock %}
