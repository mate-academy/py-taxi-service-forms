{% extends 'base.html' %}
{% load crispy_forms_filters %}
{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} Car</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Submit">
    {% if object %}
      <a href="{% url 'taxi:car-detail' pk=object.pk %}">Cancel</a>
    {% else %}
      <a href="{% url 'taxi:car-list' %}">Cancel</a>
    {% endif %}
  </form>
{% endblock %}
