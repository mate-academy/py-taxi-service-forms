{% extends "base.html" %}
{% block content%}
  <h1>Delete Car</h1>
  <p>Are you sure you want to delete "{{ object }}"?</p>
  <form method="post">
    {% csrf_token %}

    <input
      type="submit"
      value="Delete"
      class="btn btn-danger"
    >

    <button
      type="button"
      class="btn btn-secondary"
      onclick="history.back()"
    >
      Cancel
    </button>
  </form>
{% endblock %}
