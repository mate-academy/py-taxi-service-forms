{% extends "base.html" %}

{% block content %}
  <p> Are you sure you want to delete the car: {{ car.model }} ?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
  </form>
  <a href="{% url "taxi:car-detail" pk=car.id %}" class="btn btn-success">
    Cancel
  </a>
{% endblock %}
