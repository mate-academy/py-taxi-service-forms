{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer removing</h1>
  <p>Are you sure you want to delete manufacturer: {{ manufacturer }}?</p>
  <p>All cars of this manufacturer will be also deleted!</p>
  <form action="" method="post">
    {% csrf_token %}
    <button type="button"
            class="btn btn-secondary"
            onclick="history.back()">
      Cancel
    </button>
    <input class="btn btn-danger" type="submit" value="Delete">
  </form>
{% endblock %}
