{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Delete car</h1>
  <p>Are you sure that you want to delete car: {{ car.model }}?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Delete" class="btn btn-danger">
    <a href="{{ request.GET.next|default:'/' }}" class="btn btn-primary">Cancel</a>
  </form>

{% endblock %}
