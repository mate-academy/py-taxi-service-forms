{% extends "base.html" %}

{% block content %}
  <h1>Car list</h1>

  <p>
    <a href="{% url 'taxi:car-create' %}">+ Add car</a>
  </p>

  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url 'taxi:car-detail' car.id %}">
            {{ car.model }} ({{ car.manufacturer.name }})
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no cars in taxi</p>
  {% endif %}
{% endblock %}
