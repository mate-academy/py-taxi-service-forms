{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h1>{{ car.model }}</h1>
  <p class="text-muted">Manufacturer: {{ car.manufacturer.name }}</p>

  <h5>Drivers:</h5>
  <ul>
    {% for driver in car.drivers.all %}
      <li>{{ driver.username }}</li>
    {% endfor %}
  </ul>

  <div class="mt-3">
    <a class="btn btn-primary" href="{% url 'taxi:car-update' pk=car.id %}">Update</a>
    <a class="btn btn-danger" href="{% url 'taxi:car-delete' pk=car.id %}">Delete</a>
    <a class="btn btn-secondary" href="javascript:history.back()">Cancel</a>
  </div>
</div>
{% endblock %}
