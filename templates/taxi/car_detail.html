{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between">
    <p>Manufacturer: ({{ car.manufacturer.name }}, {{ car.manufacturer.country }})</p>
    <div>
      <a class="btn btn-outline-primary" href="{% url 'taxi:car-update' pk=car.id %}">Edit</a>
      <a class="ml-1 btn btn-danger" href="{% url 'taxi:car-delete' pk=car.id %}">Delete</a>
    </div>
  </div>
  <h1>Drivers</h1>
  <hr>
  <ul>
    {% for driver in car.drivers.all %}
      <li>{{ driver.username }} ({{ driver.first_name }} {{ driver.last_name }})</li>
    {% endfor %}
  </ul>
{% endblock %}
