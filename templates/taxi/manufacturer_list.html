{% extends "base.html" %}

{% block content %}
  <h1>Manufacturers</h1>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Country</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <td>{{ manufacturer.name }}</td>
          <td>{{ manufacturer.country }}</td>
          <td>
            <a href="{% url 'taxi:manufacturer-update' manufacturer.id %}">Update</a> |
            <a href="{% url 'taxi:manufacturer-delete' manufacturer.id %}">Delete</a>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3">
            <p>There are no manufacturers in the service.</p>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

  <a href="{% url 'taxi:manufacturer-create' %}">Add new manufacturer</a>
{% endblock %}
