{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block content %}
  <h1>{{ manufacturer|yesno:"Update,Create" }} Manufacturer</h1>
  <form method="POST" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Submit" class="btn btn-primary">
  </form>
  <a style="color: white;text-decoration: none" href="{{ request.META.HTTP_REFERER|default:'/manufacturer/' }}">
    <button class="btn btn-danger">Cancel</button>
  </a>
{% endblock %}
