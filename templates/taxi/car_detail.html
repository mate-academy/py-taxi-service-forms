{% extends "base.html" %}

{% block content %}
  <h1>Car Info:</h1>
  <p>Manufacturer: ({{ car.manufacturer.name }}, {{ car.manufacturer.country }})</p>
  <h3>Drivers</h3>
  <hr>
  <ul>
  {% for driver in car.drivers.all %}
    <li>{{ driver.username }} ({{ driver.first_name }} {{ driver.last_name }})</li>
  {% endfor %}
  </ul>
  <br>
  <p>
    <a href="{% url 'taxi:car-update' pk=car.id %}"><button class="btn btn-primary">UPDATE</button></a>
    <a href="{% url 'taxi:car-delete' pk=car.id%}"><button class="btn btn-warning">DELETE</button></a>
  </p>
{% endblock %}
