{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>

  <p>Are you sure you want to delete the car {{ car.model }}?</p>
  <form action="" method="post" novalidate>
    {% csrf_token %}

    <input class="btn btn-danger" type="submit" value="Yes, delete">
  </form>

  <a href="{% url "taxi:car-detail" pk=car.id %}" class="btn btn-secondary" type="button">Cancel</a>
{% endblock %}
