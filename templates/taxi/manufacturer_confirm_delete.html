{% extends "base.html" %}
{% block content %}
  <h1>Delete Manufacturer</h1>
  <p>Are you sure you want to delete the manufacturer: "{{ manufacturer.name }}"?</p>
  <p><i>All information about this manufacturer will also be deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{{ request.META.HTTP_REFERER|default:fallback_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
