{% extends "base.html" %}

{% block content %}

  <br><br>
  <h1>Delete the manufacturer</h1>
  <p><strong>Are you sure you want to delete this manufacturer: "{{ manufacturer.name }}"?</strong></p>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    <input type="submit" class="btn btn-danger" value="Yes, delete the manufacturer.">
  </form>
{% endblock %}
