{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  {% if object %}
    <h1>Update car</h1>
  {% else %}
    <h1>Create car</h1>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}

    <button type="submit">Save</button>
    <button type="button" onclick="history.back()">Cancel</button>
  </form>
{% endblock %}
