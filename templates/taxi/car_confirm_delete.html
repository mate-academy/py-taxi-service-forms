{% extends "base.html" %}
{% block content %}
  <h1>Delete car</h1>
  <p>Are you sure that you want to delete the car: {{ car.model }}</p>
  <p><i>It also will be deleted from all drivers</i></p>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
