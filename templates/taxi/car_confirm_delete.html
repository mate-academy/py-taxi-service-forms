{% extends "base.html" %}

{% block content %}
  <h1>Delete the Car</h1>
  <p>Are you sure you want to delete the car: {{ car.model }} ({{ car.manufacturer.name }})?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input class="btn btn-danger" type="submit" value="Yes, delete">
  </form>
{% endblock %}
