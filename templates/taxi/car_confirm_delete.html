{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>Delete car?</h1>

  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}

    <button type="submit" class="btn btn-danger">
      Confirm
    </button>
    <button type="button" class="btn btn-secondary" onclick="window.history.back();">
      Cancel
    </button>

  </form>
{% endblock %}
