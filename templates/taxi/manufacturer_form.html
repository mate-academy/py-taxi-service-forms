{% extends 'base.html' %}
{% load crispy_forms_filters %}


{% block content %}

  {% if manufacturer %}
    <h1>Update Manufacturer</h1>
  {% else %}
    <h1>Create Manufacturer</h1>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" value="Submit">Submit</button>
  </form>

{% endblock %}
