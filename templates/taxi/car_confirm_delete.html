{% extends "base.html" %}

{% block content %}
  <h1>Delete car</h1>
  <p>Are you sure you want to delete the car "{{ car }}"?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    {% url 'taxi:car-detail' pk=car.id as car_detail_url %}
    <a href="{{ request.META.HTTP_REFERER|default:car_detail_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
