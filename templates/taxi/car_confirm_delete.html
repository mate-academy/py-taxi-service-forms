{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>
  <p>Are you sure you want to delete the car: {{ car }} ?</p>
  <p><i style="color: #ff0000; font-weight: bold">All Drivers and Manufactures with this model car will be also deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete"/>
  </form>
{% endblock %}
